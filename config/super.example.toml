# Copy to config/super.toml and adjust paths for the current machine.
[core]
data_dir = "var"
db_path = "var/super.db"
api_host = "127.0.0.1"
api_port = 8787
workspace_dir = "D:/devProject"

[patrol]
enabled = true
interval_sec = 900
run_on_start = true

[policy]
external_requires_approval = true
destructive_requires_approval = true
max_parallel_tasks = 3
auto_plan = true
auto_plan_per_cycle = 2
max_pending_backlog = 12
auto_run_max_level = 4
daily_cost_budget_usd = 5.0

[workers.claude]
enabled = true
command = "claude"

[workers.codex]
enabled = true
command = ""          # auto-detected on Windows
sandbox = "danger-full-access"

[notify]
desktop = true
cooldown_sec = 120

[digest]
enabled = true
time = "08:00"
notify = true
lookback_days = 7
max_papers = 8
max_per_source = 4
min_paper_score = 3.0
sources = ["pubmed", "europepmc", "arxiv"]
keywords = [
  "photosystem I", "PsaE", "photosystem II", "cyanobacteria", "Synechocystis",
  "chloroplast", "plastid genome", "photosynthesis", "phylogenomics", "ycf51",
  "plastid annotation",
]
max_skills = 4
skill_cooldown_days = 14
skill_dirs = ["~/.dsh/skills", "~/.dsh/vendor", "~/.claude/skills"]
max_github_skills = 2
github_skills_queries = ["topic:claude-skills academic", "topic:claude-skills research"]
github_skills_min_stars = 20
github_skills_keywords = ["research", "academic", "scholar", "science", "phd", "literature", "bioinformatics", "laboratory", "manuscript", "citation"]
max_repos = 5
min_repo_stars = 10
repo_max_age_days = 730
repo_queries = [
  "cyanobacteria", "photosystem", "plastid genome", "chloroplast genome",
  "phylogenetics", "molecular evolution", "bioinformatics pipeline",
]
exclude_users = []
blocked_repo_terms = ["z-library", "shadow library", "影子图书馆", "piracy", "盗版"]
obsidian_sync = true
obsidian_vault = "D:/devProject/super建议"

[collectors.filesystem]
enabled = true
paths = ["C:/Users/<you>/Desktop", "C:/Users/<you>/Documents"]
recency_days = 14

[collectors.git]
enabled = true
roots = ["D:/devProject"]

[collectors.github]
enabled = true

[collectors.zotero]
enabled = true
db_path = "C:/Users/<you>/Zotero/zotero.sqlite"

[collectors.dsh]
enabled = true
home = "C:/Users/<you>/.dsh"

[collectors.obsidian]
enabled = true
vault = "C:/Users/<you>/Documents/Obsidian Vault"

[collectors.calendar]
enabled = false
paths = ["C:/Users/<you>/Desktop"]

[collectors.email]
enabled = false
host = ""
username = ""
password_env = "SUPER_EMAIL_PASSWORD"
