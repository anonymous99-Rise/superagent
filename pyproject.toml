[project]
name = "superagent-local"
version = "0.1.0"
description = "Proactive mission control that connects Claude Code, Codex, DSH, Zotero and your local context."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dsh = ["zstandard>=0.22"]
dev = ["pytest>=8"]

[project.scripts]
superagent = "superagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["superagent*"]
